<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="articles.css">
    <title>Articles - NewsForge</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Latest <span class="highlight">News Articles</span></h1>
            <!-- Category name will be shown here -->
            <p class="subheading">Curated news from the selected category: <span id="categoryName"></span></p>
        </header>

        <main>
            <div id="articlesList" class="articles-list"></div>
        </main>

        <footer>
            <p>&copy; 2025 NewsForge. Delivering insights with data-driven news.</p>
        </footer>
    </div>

    <script>
        // Get the category from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('category');
    
        // Ensure category is available
        if (!category) {
            console.error('Category is missing from the URL');
            document.getElementById('categoryName').textContent = 'No category selected';
        } else {
            // Set the category name in the header
            document.getElementById('categoryName').textContent = category;
    
            // Fetch articles based on the category
            async function fetchArticles() {
                try {
                    const response = await fetch(`https://newsforge-p9te.onrender.com/api/news?category=${category}`);
                    if (!response.ok) throw new Error('Failed to fetch articles');
                    const data = await response.json();
    
                    if (data.length === 0) {
                        document.getElementById('articlesList').innerHTML = '<p>No articles found for this category.</p>';
                    } else {
                        const articlesList = document.getElementById('articlesList');
                        data.forEach(article => {
                            // Fallback for missing or invalid content
                            let content = article.content;
                            if (!content || content === "[Removed]") {
                                content = "Content not available";  // Fallback message
                            }

                            // Format the date to a readable format
                            const date = new Date(article.publishedAt);
                            const formattedDate = date.toLocaleDateString(); // Format the date as MM/DD/YYYY
    
                            // Create and append article element
                            const articleElement = document.createElement('div');
                            articleElement.innerHTML = `
                                <h3>${article.title}</h3>
                                <p><strong>Published on:</strong> ${formattedDate}</p> <!-- Display publication date -->
                                <p>${content}</p>
                                <a href="${article.url}" target="_blank">Read More</a>
                            `;
                            articlesList.appendChild(articleElement);
                        });
                    }
                } catch (error) {
                    console.error('Error fetching articles:', error);
                }
            }
    
            fetchArticles();
        }
    </script>
    
</body>
</html>
